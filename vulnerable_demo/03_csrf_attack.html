<!-- ========================================================================
     LAB-ONLY — CSRF (CWE-352) attack proof-of-concept.

     Host this page on a DIFFERENT origin (e.g. http://localhost:8001 served

    <!-- Note: no csrf_token field. The secure server requires it. -->
  </form>

</body>
</html>
